name: WeightMe
options:
  bundleIdPrefix: me.fridman
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.2"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: 32R3YRS5WJ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  WeightMe:
    type: application
    platform: iOS
    sources:
      - path: WeightMe
      - path: Shared
    dependencies:
      - target: WeightMeWidgets
        embed: true
      - target: WeightMeWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    info:
      path: Config/WeightMe-Info.plist
      properties:
        CFBundleDisplayName: WeightMe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHealthShareUsageDescription: WeightMe reads your weight history from Apple Health to chart it.
        NSHealthUpdateUsageDescription: WeightMe saves the weights you log or import to Apple Health.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: me.fridman.weightme
            CFBundleURLSchemes: [weightme]
        LSSupportsOpeningDocumentsInPlace: false
        UIRequiredDeviceCapabilities: [healthkit]
    entitlements:
      path: Config/WeightMe.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.me.fridman.weightme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fridman.weightme
        PRODUCT_NAME: WeightMe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Empty locally (automatic signing). CI's App Store build passes CODE_SIGN_STYLE=Manual
        # and the profile names (see .github/workflows/testflight.yml).
        PROVISIONING_PROFILE_SPECIFIER: $(WEIGHTME_APP_PROFILE)

  WeightMeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WeightMeWidgets
      - path: Shared
    info:
      path: Config/WeightMeWidgets-Info.plist
      properties:
        CFBundleDisplayName: WeightMe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/WeightMeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.fridman.weightme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fridman.weightme.widgets
        PROVISIONING_PROFILE_SPECIFIER: $(WEIGHTME_WIDGET_PROFILE)
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground

  WeightMeWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: WeightMeWatch
      - path: Shared/WeightUnit.swift
    info:
      path: Config/WeightMeWatch-Info.plist
      properties:
        CFBundleDisplayName: WeightMe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: me.fridman.weightme
        WKRunsIndependentlyOfCompanionApp: false
        NSHealthShareUsageDescription: WeightMe shows your latest weight from Apple Health.
        NSHealthUpdateUsageDescription: WeightMe saves the weights you log on your watch to Apple Health.
    entitlements:
      path: Config/WeightMeWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fridman.weightme.watchkitapp
        PRODUCT_NAME: WeightMeWatch
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PROVISIONING_PROFILE_SPECIFIER: $(WEIGHTME_WATCH_PROFILE)

  WeightMeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WeightMeTests
    dependencies:
      - target: WeightMe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: me.fridman.weightme.tests

  WeightMeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WeightMeUITests
    dependencies:
      - target: WeightMe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: me.fridman.weightme.uitests
        TEST_TARGET_NAME: WeightMe
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  WeightMeWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: WeightMeWatchUITests
    dependencies:
      - target: WeightMeWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: me.fridman.weightme.watchuitests
        TEST_TARGET_NAME: WeightMeWatch
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  WeightMe:
    build:
      targets:
        WeightMe: all
        WeightMeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WeightMeTests
  WeightMeWatch:
    build:
      targets:
        WeightMeWatch: all
        WeightMeWatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WeightMeWatchUITests
  WeightMeUITests:
    build:
      targets:
        WeightMe: all
        WeightMeUITests: [test]
    test:
      config: Debug
      targets:
        - WeightMeUITests
    archive:
      config: Release
